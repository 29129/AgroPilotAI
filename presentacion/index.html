    (() =&gt; {
      const root = document.getElementById(&#x27;agropilot-deck&#x27;);
      const slides = Array.from(root.querySelectorAll(&#x27;.slide&#x27;));
      const current = root.querySelector(&#x27;#deck-current&#x27;);
      const progress = root.querySelector(&#x27;#deck-progress&#x27;);
      const previousButton = root.querySelector(&#x27;#deck-prev&#x27;);
      const nextButton = root.querySelector(&#x27;#deck-next&#x27;);
      let index = 0;
      let isChanging = false;

      const showSlide = (nextIndex) =&gt; {
        if (isChanging || nextIndex === index || nextIndex &lt; 0 || nextIndex &gt;= slides.length) return;
        isChanging = true;
        const outgoing = slides[index];
        const incoming = slides[nextIndex];
        outgoing.classList.remove(&#x27;is-active&#x27;);
        outgoing.classList.add(&#x27;is-exiting&#x27;);
        incoming.classList.add(&#x27;is-active&#x27;);
        current.textContent = String(nextIndex + 1).padStart(2, &#x27;0&#x27;);
        progress.style.transform = `scaleX(${(nextIndex + 1) / slides.length})`;
        window.setTimeout(() =&gt; {
          outgoing.classList.remove(&#x27;is-exiting&#x27;);
          index = nextIndex;
          isChanging = false;
        }, 620);
      };

      const next = () =&gt; showSlide(index === slides.length - 1 ? 0 : index + 1);
      const previous = () =&gt; showSlide(index === 0 ? slides.length - 1 : index - 1);
      previousButton.addEventListener(&#x27;click&#x27;, previous);
      nextButton.addEventListener(&#x27;click&#x27;, next);
      document.addEventListener(&#x27;keydown&#x27;, (event) =&gt; {
        if (event.key === &#x27;ArrowRight&#x27; || event.key === &#x27; &#x27; || event.key === &#x27;Enter&#x27;) { event.preventDefault(); next(); }
        if (event.key === &#x27;ArrowLeft&#x27;) { event.preventDefault(); previous(); }
        if (event.key === &#x27;Home&#x27;) { event.preventDefault(); showSlide(0); }
        if (event.key === &#x27;End&#x27;) { event.preventDefault(); showSlide(slides.length - 1); }
      });
      progress.style.transform = `scaleX(${1 / slides.length})`;
    })();
